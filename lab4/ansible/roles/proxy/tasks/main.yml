---
- name: Встановлення веб-сервера Nginx
  apt:
    name: nginx
    state: present

- name: Генерація конфігурації Reverse Proxy з шаблону
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/app_proxy
    mode: '0644'
  notify: Перезапуск Nginx

- name: Активація конфігурації через створення лінку
  file:
    src: /etc/nginx/sites-available/app_proxy
    dest: /etc/nginx/sites-enabled/app_proxy
    state: link

- name: Видалення дефолтного конфігу Nginx, щоб не заважав
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Перезапуск Nginx

- name: Запуск та увімкнення Nginx в автозапуск
  systemd:
    name: nginx
    state: started
    enabled: yes
