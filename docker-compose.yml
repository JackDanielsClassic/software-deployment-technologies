version: '3.8'

services:

  db:
    image: mariadb:10.11
    container_name: lab-mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: notes_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - lab_network

  app:
    build:
      context: ./app
    container_name: lab-nodejs-app
    restart: always
    command: ["node", "server.js", "--db-host=db", "--db-user=app_user", "--db-pass=app_password", "--db-name=notes_db"]
    depends_on:
      - db
    networks:
      - lab_network

  nginx:
    image: nginx:alpine
    container_name: lab-nginx
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - lab_network

volumes:
  db_data:

networks:
  lab_network:
    driver: bridge