name: CI Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './app/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./app

      - name: Run ESLint
        run: npm run lint
        working-directory: ./app

      - name: Run Hadolint (Docker Linter)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./app/Dockerfile

      - name: Run Tests with Coverage
        run: npm run test
        working-directory: ./app

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ./app/coverage/

  build-and-push:
    needs: test-and-lint
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
        needs: build-and-push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: self-hosted
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Deploy to Target Node
            run: |
              scp -o StrictHostKeyChecking=no docker-compose.yml ubuntu@192.168.56.102:~/app/
              scp -o StrictHostKeyChecking=no -r app ubuntu@192.168.56.102:~/app/
              scp -o StrictHostKeyChecking=no -r db ubuntu@192.168.56.102:~/app/ || true
              scp -o StrictHostKeyChecking=no -r deploy ubuntu@192.168.56.102:~/app/ || true
          
              ssh -o StrictHostKeyChecking=no ubuntu@192.168.56.102 << 'EOF'
                cd ~/app
              
                docker compose down
                docker compose up -d --build
              EOF

          - name: Verify Deployment
            run: |
                echo "Waiting for the application to be ready..."
                for i in {1..10}; do
                  if curl -f http://192.168.56.102/; then
                    echo "Deployment verified successfully!"
                    exit 0
                  fi
                  echo "App not ready yet. Retrying in 5 seconds... (Attempt $i/10)"
                  sleep 5
                done
                echo "Deployment verification failed after 50 seconds!"
                exit 1